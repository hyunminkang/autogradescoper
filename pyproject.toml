[project]
name = "autogradescoper"
description = "Function-level autograding for Gradescope in R, Python, and C++ (Rcpp), with no custom Docker image"
version = "0.1.0"
authors = [{name = "Hyun Min Kang", email = "hmkang@umich.edu"}]
license = {text = "MIT license"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML"
]

[project.scripts]
autogradescoper = "autogradescoper.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
autogradescoper = ["assets/*", "templates/*"]

[project.urls]
"Homepage" = "https://hyunminkang.github.io/autogradescoper/"
"Bug Tracker" = "https://github.com/hyunminkang/autogradescoper/issues"
